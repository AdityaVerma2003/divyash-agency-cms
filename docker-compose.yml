version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: divyash_agency_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: divyash
      POSTGRES_PASSWORD: divyash_dev_password
      POSTGRES_DB: divyash_agency
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
